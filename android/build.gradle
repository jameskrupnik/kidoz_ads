group = "com.illuminationdevelopment.kidoz_ads"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.illuminationdevelopment.kidoz_ads"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    // 10.1.9, 2026-07-14. Kidoz publishes to Maven Central under net.kidoz.sdk.
    //
    // Pinned exactly rather than ranged, for the same reason google_mobile_ads
    // is pinned in the apps that consume this: an ad SDK minor release is a
    // change to a native dependency graph, and the way it breaks is at the
    // link step of one platform only.
    implementation "net.kidoz.sdk:kidoz-android-native:10.1.9"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
